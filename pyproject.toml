[project]
name = "mult-agent-research-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nepseli", email = "neps.eli@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crewai[litellm]>=1.15.41",
    "crewai-tools>=1.15.41",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "pydantic>=2.12.5",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "markdown>=3.11.3",
]

[project.scripts]
mult-agent-research-assistant = "mult_agent_research_assistant:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.165.0",
    "pytest>=9.2.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
